#Jane configuration, as installed by the deb package to /etc/opt/jane/config.yaml
#Every option Jane reads is listed here; optional sections are commented out.

#Some general naming
system:
  name: ASVR_GO_1_DEBBUILD


#MongoDB Configuration
database:
  connection: mongodb://127.0.0.1:27017
  name: asvr


#MQTT Configuration
messaging:
  broker: 127.0.0.1
  port: 1883
  portws: 8081
  clientid: asvrgo1debbuild


#REST Interface Configuration
#listenon is the address to bind to: 0.0.0.0 for all interfaces, 127.0.0.1 for this machine only (empty = all)
rest:
  port: 8520
  crt: /etc/opt/jane/REPLACE_ME.crt
  key: /etc/opt/jane/REPLACE_ME.key
  usehttp: true
  listenon: 0.0.0.0


#Web Interface Configuration
web:
  port: 8540
  crt: /etc/opt/jane/REPLACE_ME.crt
  key: /etc/opt/jane/REPLACE_ME.key
  usehttp: true
  listenon: 0.0.0.0


#X3270 (tn3270 terminal) Interface Configuration
#tn3270 is unencrypted, including passwords when auth: x3270: true. Prefer 127.0.0.1 and an SSH tunnel.
x3270:
  port: 3270
  listenon: 0.0.0.0


#Log file
logging:
  logfilelocation: /var/log/jane/jane.log
  sessionupdatelogging: false


#Attestation sessions
#longsession: sessions open (or that were open) longer than this many seconds are flagged
#LONG SESSION in the Web UI and x3270; minimum 30, default 60
sessions:
  longsession: 60


#Footer signing (optional - if this section is missing, an ephemeral key is generated at each start
#and footers on claims, results and sessions cannot be verified once Jane stops)
#The key is a PEM private key: PKCS#8, PKCS#1 or SEC1; RSA (PS256), ECDSA P-256/384/521 (ES256/384/512) or Ed25519 (EdDSA)
#e.g. openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out /etc/opt/jane/signing.key
#     chown root:jane /etc/opt/jane/signing.key; chmod 640 /etc/opt/jane/signing.key
#signing:
#  keyfile: /etc/opt/jane/signing.key


#Authentication (optional - if this section is missing, no login is required)
#Users are held in the "users" collection; add them, reset passwords or make REST API keys with /opt/jane/addjaneuser, e.g.
#  /opt/jane/addjaneuser ian mongodb://127.0.0.1:27017 asvr
#  /opt/jane/addjaneuser --apikey cluster-a mongodb://127.0.0.1:27017 asvr
#(needs python3-argon2 and python3-pymongo; see /usr/share/doc/janeattestationengine/addjaneuser.md)
auth:
  web: false           # require a login for the Web UI
  rest: false          # require an API key for the REST API (jp/scripts send Authorization: Bearer jane_...; keys from addjaneuser --apikey)
  x3270: false         # require a logon on the x3270 interface (passwords travel unencrypted; see x3270: above)
  sessiontimeout: 30m  # Web UI login, or x3270 logon, expires after this long without use
