#Some general naming
system:
  name: ASVR_GO_1_DEBBUILD


#MongoDB Configuration
database:
  connection: mongodb://127.0.0.1:27017
  name: asvr


#MQTT Configuration
messaging:
  broker: 127.0.0.1
  port: 1883
  portws: 8081  
  clientid: asvrgo1debbuild


#REST Interface Configuration
rest:
  port: 8520
  crt: /etc/opt/jane/REPLACE_ME.crt
  key: /etc/opt/jane/REPLACE_ME.key
  usehttp: true


#Web Interface Configuration
web:
  port: 8540
  crt: /etc/opt/jane/REPLACE_ME.crt
  key: /etc/opt/jane/REPLACE_ME.key
  usehttp: true  


#Web Interface Configuration
x3270:
  port: 3270
    

#Log file
logging:
  logfilelocation: /var/log/jane/jane.log
  sessionupdatelogging: false


#Footer signing (optional - if this section is missing, an ephemeral key is generated at each start
#and footers on claims, results and sessions cannot be verified once Jane stops)
#The key is a PEM private key: PKCS#8, PKCS#1 or SEC1; RSA (PS256), ECDSA P-256/384/521 (ES256/384/512) or Ed25519 (EdDSA)
#e.g. openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out signing.key
#signing:
#  keyfile: /etc/opt/jane/signing.key

#Authentication (optional - if this section is missing, no login is required)
#Users are held in the "users" collection; add them or reset passwords with etc/addjaneuser, e.g.
#  etc/addjaneuser ian mongodb://127.0.0.1:27017 testasvrlocal
auth:
  web: false            # require a login for the Web UI
  rest: false          # require HTTP Basic auth for the REST API (provisioner/scripts must then send credentials)
  sessiontimeout: 8h   # Web UI login expires after this long without use
