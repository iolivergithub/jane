# Dependabot version updates for every Go module in the repository
# (https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file).
# A module added under lib/ needs its directory added here.

version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/janeserver"
      - "/tarzan"
      - "/provisioner"
      - "/lib/janeapi"
      - "/lib/localnames"
      - "/lib/machineid"
      - "/lib/tpmopen"
      - "/lib/uefi"
    schedule:
      interval: "weekly"
