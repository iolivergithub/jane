#A Sample Provisioning File

attestationserver: http://central.local:8520
element:
  name: Pi
  description: Raspberry Pi
  tags:
    - linux
    - arm
    - tpm2
    - pi    
endpoints:
  tarzan:
      endpoint: http://pi.local:8530
      protocol: A10HTTPRESTv2
  ratds:
      endpoint: http://pi.local:8531
      protocol: RATSD      
tpm2:
  device:   /dev/tpmrm0   
  ekcerthandle: '0x1C000002'   
  ek:
    handle: '0x810100EE'
  ak:
    handle: '0x810100AA'
provisionworklist:
  - tpmclear
  - tpmprovision
  - collecthostinfo
  - collecttpm2
  - collectuefi
  - collectima
  - makebetterdescription
  - processelement
#  - processevs
  - processevs_withrules

evs:
  - std::intent::sys::info :
      protocol: tarzan
      type: sysmachineid
      rules: 
        - sys_taRunningSafely  
        - sys_machineID_Agent 
        - sys_machineID_CrossRef 
  - std::intent::sha256::crtm::pcr0 :
      protocol: tarzan
      type: tpm2quote      
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce 
  - std::intent::sha256::crtm::firmware :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce
  - std::intent::sha256::crtm::bootloaderonly  :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce
  - std::intent::tpm::pcrs :
      protocol: tarzan  