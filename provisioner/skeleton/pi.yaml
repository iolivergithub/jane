#A Sample Provisioning File

attestationserver: http://central.local:8520
element:
  name: Pi
  description: Raspberry Pi
  tags:
    - linux
    - arm
    - tpm2
    - pi    
endpoints:
  tarzan:
      endpoint: http://pi.local:8530
      protocol: A10HTTPRESTv2
  ratds:
      endpoint: http://pi.local:8895
      protocol: RATSD      
tpm2:
  device:   /dev/tpmrm0   
  ekcerthandle: '0x1C000002'   
  ek:
    handle: '0x810100EE'
  ak:
    handle: '0x810100AA'
provisionworklist:
  - tpmclear
  - tpmprovision
  - collecthostinfo
  - collecttpm2
  - collectuefi
  - collectima
  - makebetterdescription
  - processelement
  - processevs

evs:
  - std::intent::sys::info :
      protocol: tarzan
      type: sysmachineid
      rules: 
        - sys_taRunningSafely  
        - sys_machineID_Agent 
        - sys_machineID_CrossRef 
  # the PCRs, collected before the quotes, so that tpm2_pcrDigest can check
  # them against each quote (cid names the claim's itemid, $pcrs passes it to
  # the rule; see the provisioner README). No UEFI event log on the Pi.
  - std::intent::tpm::pcrs :
      protocol: tarzan
      cid: pcrs
  - std::intent::sha256::crtm::pcr0 :
      protocol: tarzan
      type: tpm2quote      
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce 
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  - std::intent::sha256::crtm::firmware :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  - std::intent::sha256::crtm::bootloaderonly  :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  - std::intent::tpm2::activatecredential :
      protocol: tarzan
      rules:
        - tpm2_credentialActivated
        - tpm2_akAttributes
  # TPM clock, reset and restart counters (signed) and the TPM's identity and
  # configuration (unsigned); no rules yet
  - std::intent::tpm2::gettime :
      protocol: tarzan
  - std::intent::tpm2::capabilities :
      protocol: tarzan
