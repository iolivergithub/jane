# jp provisioning file: tpm2-nouefi (TPM, no UEFI)
#
# A board with a TPM but no UEFI firmware, e.g. a Raspberry Pi with a TPM module: the
# TPM intents and rules, no UEFI event log or variables.
#
# One of four skeletons, by what the machine can show (#125):
#   full.yaml          physical Linux machine, UEFI, discrete or firmware TPM
#   full-vm.yaml       virtual machine with UEFI and a vTPM
#   tpm2-nouefi.yaml   board with a TPM but no UEFI (e.g. Raspberry Pi with a TPM)
#   sysonly.yaml       no TPM: the trust agent's system information only
# All four are installed by the tarzan package in
# /usr/share/doc/tarzantrustagent/skeletons/ (and full.yaml as
# /etc/opt/jane/provisioning.yaml.example). Copy one, edit the copy, then:
#   sudo /opt/jane/jp create --reprovisiontpm <file>     (first time)
#   sudo /opt/jane/jp attest <file>                      (any time)
# Leave out what the machine cannot do: a rule on a claim that failed is
# recorded as a failure on every run. See docs/jp.md.

attestationserver: http://127.0.0.1:8520
element:
  name: Pi
  description: Raspberry Pi with TPM
  # free text; de facto physical-machine or virtual-machine (#118)
  elementtype: physical-machine
  tags:
    - linux
    - arm
    - tpm2
    - pi
endpoints:
  tarzan:
      endpoint: http://127.0.0.1:8530
      protocol: A10HTTPRESTv2
  # ratsd (Veraison's attestation daemon): uncomment once ratsd is installed on this
  # machine and listening on port 8895, to use the ratsd intents at the end.
  #ratsd:
  #    endpoint: http://127.0.0.1:8895
  #    protocol: RATSD
tpm2:
  device:   /dev/tpmrm0
  # NV index of the EK certificate, read by std::intent::tpm2::getcert
  # (0x01C00002: RSA 2048, the usual one; 0x01C0000A: ECC P-256)
  ekcerthandle: '0x01C00002'
  # register naming scheme for the PCRs on claim pages (jane: Register names)
  pcrnaming: tcg-pcclient-uefi
  ek:
    handle: '0x810100EE'
  ak:
    handle: '0x810100AA'
provisionworklist:
  # tpmclear evicts (deletes) the persistent keys at the EK and AK handles above, so
  # that tpmprovision can create them afresh; it does not clear the rest of the TPM.
  # Whatever was stored at those two handles is lost, and Jane's record of the old keys
  # no longer matches until jp registers the new ones. Both steps run only when jp
  # create/update is given --reprovisiontpm; otherwise they are skipped and the TPM is
  # left unchanged, so jp can run unattended. jp attest never runs them.
  - tpmclear
  - tpmprovision
  - collecthostinfo
  - collecttpm2
  # collectima only records where the IMA log is; harmless without IMA
  - collectima
  - makebetterdescription
  - processelement
  - processevs

evs:
  - std::intent::sys::info :
      protocol: tarzan
      type: sysmachineid
      rules:
        - sys_taRunningSafely
        - sys_machineID_Agent
        - sys_machineID_CrossRef
  # the PCRs, collected before the quotes, so that tpm2_pcrDigest can check
  # them against each quote (cid names the claim's itemid, $pcrs passes it to
  # the rule; see docs/jp.md). No UEFI event log to replay on this machine.
  - std::intent::tpm::pcrs :
      protocol: tarzan
      cid: pcrs
  # quotes (signed by the AK); without UEFI firmware most of PCRs 0-7 may be
  # empty, which is still a value to compare
  - std::intent::sha256::crtm::pcr0 :
      protocol: tarzan
      cid: q_pcr0
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_type
        - tpm2_safe
        - tpm2_validNonce
        - tpm2_validSignature
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  - std::intent::sha256::crtm::firmware :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_type
        - tpm2_safe
        - tpm2_validNonce
        - tpm2_validSignature
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  - std::intent::sha256::crtm::bootloaderonly :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_type
        - tpm2_safe
        - tpm2_validNonce
        - tpm2_validSignature
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  # PCRs 0 and 10: needs IMA; uncomment with std::intent::linux::ima::asciilog below
  # - std::intent::sha256::linuxIMA :
  #     protocol: tarzan
  #     type: tpm2quote
  #     rules:
  #       - tpm2_attestedValue
  #       - tpm2_firmware
  #       - tpm2_magicNumber
  #       - tpm2_type
  #       - tpm2_safe
  #       - tpm2_validNonce
  #       - tpm2_validSignature
  #       - tpm2_pcrDigest:
  #           parameters: { "pcrscid": $pcrs }
  # the IMA measurement list: uncomment if the kernel runs IMA (tarzan -ima)
  #- std::intent::linux::ima::asciilog :
  #    protocol: tarzan
  # the AK is in the same TPM as the EK, and is a proper attestation key
  - std::intent::tpm2::activatecredential :
      protocol: tarzan
      rules:
        - tpm2_credentialActivated
        - tpm2_akAttributes
  # TPM clock, reset and restart counters (signed): the signature, and progress since the
  # pcr0 quote above (within this run; give an older claim's itemid to compare sessions).
  # Leave out on TPMs without TPM2_GetTime (see the commands on the capabilities claim)
  - std::intent::tpm2::gettime :
      protocol: tarzan
      rules:
        - tpm2_validSignature
        - tpm2_clockProgress:
            parameters: { "previouscid": $q_pcr0 }
  # the TPM's identity and configuration (unsigned): its firmware version must equal the
  # signed one in the pcr0 quote
  - std::intent::tpm2::capabilities :
      protocol: tarzan
      rules:
        - tpm2_capabilitiesFirmware:
            parameters: { "quotecid": $q_pcr0 }
  # the EK certificate from the TPM's NV storage (unsigned): it must hold the element's EK
  # and be issued by the certificates at issuerurl. jp takes issuerurl from the
  # certificate's CA Issuers URL unless given here (https://, http:// or file://, e.g.
  # where a manufacturer's certificates were put). Leave out if the TPM has no EK
  # certificate (most vTPMs, some boards).
  - std::intent::tpm2::getcert :
      protocol: tarzan
      type: tpm2ekcert
      #issuerurl: file:///etc/opt/jane/ekca/infineon.pem
      rules:
        - tpm2_ekCertMatchesEK
        - tpm2_ekCertIssuer
  # ratsd (uncomment with the ratsd endpoint above): its leaf attesters, and their
  # evidence as a CMW collection with the nonces checked
  #- std::intent::ratsd::subattesters :
  #    protocol: ratsd
  #- std::intent::ratsd::chares :
  #    protocol: ratsd
  #    rules:
  #      - chares_validNonce
  #      - chares_validAttesterNonces
