#A Sample Provisioning File

attestationserver: http://central.local:8520
element:
  name: Debian13VM
  description: Debian 13 VM
  tags:
    - linux
    - x86
    - tpm2
    - uefi  
    - vbox
endpoints:
  tarzan:
      endpoint: http://debianwork.local:8530
      protocol: A10HTTPRESTv2
  # ratsd (Veraison's attestation daemon): uncomment once ratsd is installed on this
  # machine and listening on port 8895, to use the std::intent::ratsd::* intents.
  #ratsd:
  #    endpoint: http://debianwork.local:8895
  #    protocol: RATSD
tpm2:
  device:   /dev/tpmrm0   
  ekcerthandle: '0x1C000002'   
  ek:
    handle: '0x810100EE'
  ak:
    handle: '0x810100AA'
provisionworklist:
  # tpmclear runs TPM2_Clear: it deletes every key in the TPM's owner and endorsement
  # hierarchies (including any existing EK and AK, and keys used by other software such
  # as disk encryption or SSH) and resets the owner and endorsement passwords.
  # WARNING: only for a TPM that nothing else on this machine depends on. jp asks before
  # running it unless -u is given. tpmprovision creates the EK and AK afresh, so it needs
  # free handles: to keep the existing keys, answer n to both TPM questions.
  - tpmclear
  - tpmprovision
  - collecthostinfo
  - collecttpm2
  - collectuefi
  - collectima
  - makebetterdescription
  - processelement
  - processevs

evs:
  - std::intent::sys::info :
      protocol: tarzan
      type: sysmachineid
      rules: 
        - sys_taRunningSafely  
        - sys_machineID_Agent 
        - sys_machineID_CrossRef 
  # the event log and the PCRs, collected before the quotes, so that the
  # rules can check event log -> PCRs -> quote (cid names a claim's itemid,
  # $name passes it to a rule; see the provisioner README)
  - std::intent::uefi::eventlog :
      protocol: tarzan
      cid: uefilog
  - std::intent::tpm::pcrs :
      protocol: tarzan
      cid: pcrs
      rules:
        - tpm2_uefiLogReplay:
            rid: r_uefilog
            resvar: r_uefilog_code
            parameters: { "uefilogcid": $uefilog }
  - std::intent::sha256::crtm::pcr0 :
      protocol: tarzan
      type: tpm2quote      
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce 
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  - std::intent::sha256::crtm::firmware :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  - std::intent::sha256::crtm::bootloaderonly  :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce
        - tpm2_pcrDigest:
            parameters: { "pcrscid": $pcrs }
  - std::intent::linux::ima::asciilog :
      protocol: tarzan
  - std::intent::tpm2::activatecredential :
      protocol: tarzan
      rules:
        - tpm2_credentialActivated
        - tpm2_akAttributes
  # TPM clock, reset and restart counters (signed) and the TPM's identity and
  # configuration (unsigned); no rules yet
  - std::intent::tpm2::gettime :
      protocol: tarzan
  - std::intent::tpm2::capabilities :
      protocol: tarzan
  - std::intent::uefi::efivars :
      protocol: tarzan
      type: uefiefivars
      rules:
        - UEFI_SecureBoot
        - UEFI_SetupMode
        - UEFI_AuditMode
        - UEFI_DeployedMode
        - UEFI_VendorKeys
        - UEFI_PK
        - UEFI_KEK
        - UEFI_db
        - UEFI_MokSBStateRT
        # these change with firmware (fwupd) and shim/SBAT (apt) updates;
        # run jp update afterwards to refresh the expected value
        - UEFI_dbx
        - UEFI_SbatLevelRT
        - UEFI_MokListRT
        - UEFI_MokListXRT
        - UEFI_PKDefault
        - UEFI_KEKDefault
        - UEFI_dbDefault
        - UEFI_dbxDefault
