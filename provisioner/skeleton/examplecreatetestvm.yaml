#A Sample Provisioning File

attestationserver: http://central.local:8520
element:
  name: Debian13VM
  description: Debian 13 VM
  tags:
    - linux
    - x86
    - tpm2
    - uefi  
    - vbox
endpoints:
  tarzan:
      endpoint: http://debianwork.local:8530
      protocol: A10HTTPRESTv2
  ratds:
      endpoint: http://debianwork.local:8531
      protocol: RATSD      
tpm2:
  device:   /dev/tpmrm0   
  ekcerthandle: '0x1C000002'   
  ek:
    handle: '0x810100EE'
  ak:
    handle: '0x810100AA'
provisionworklist:
  - tpmclear
  - tpmprovision
  - collecthostinfo
  - collecttpm2
  - collectuefi
  - collectima
  - makebetterdescription
  - processelement
#  - processevs
  - processevs_withrules

evs:
  - std::intent::sys::info :
      protocol: tarzan
      type: sysmachineid
      rules: 
        - sys_taRunningSafely  
        - sys_machineID_Agent 
        - sys_machineID_CrossRef 
  - std::intent::sha256::crtm::pcr0 :
      protocol: tarzan
      type: tpm2quote      
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce 
  - std::intent::sha256::crtm::firmware :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce
  - std::intent::sha256::crtm::bootloaderonly  :
      protocol: tarzan
      type: tpm2quote
      rules:
        - tpm2_attestedValue
        - tpm2_firmware
        - tpm2_magicNumber
        - tpm2_safe
        - tpm2_validNonce
  - std::intent::linux::ima::asciilog :
      protocol: tarzan
  - std::intent::tpm::pcrs :
      protocol: tarzan  
  - std::intent::tpm2::activatecredential :
      protocol: tarzan
      rules:
        - tpm2_credentialActivated
        - tpm2_akAttributes
  - std::intent::uefi::efivars :
      protocol: tarzan
      type: uefiefivars
      rules:
        - UEFI_SecureBoot
        - UEFI_SetupMode
        - UEFI_AuditMode
        - UEFI_DeployedMode
        - UEFI_VendorKeys
        - UEFI_PK
        - UEFI_KEK
        - UEFI_db
        - UEFI_MokSBStateRT
        # these change with firmware (fwupd) and shim/SBAT (apt) updates;
        # run jp update afterwards to refresh the expected value
        - UEFI_dbx
        - UEFI_SbatLevelRT
        - UEFI_MokListRT
        - UEFI_MokListXRT
        - UEFI_PKDefault
        - UEFI_KEKDefault
        - UEFI_dbDefault
        - UEFI_dbxDefault
