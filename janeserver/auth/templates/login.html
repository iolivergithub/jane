<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jane - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary justify-content-center">
      <span class="navbar-brand mb-0 h1">Jane</span>
    </nav>

    <div class="container">
      <div class="row justify-content-center mt-5">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-1">Log in</h1>
              {{ if .SystemName }}<p class="text-muted small mb-3">{{ .SystemName }}</p>{{ end }}

              {{ if .Error }}
              <div class="alert alert-danger py-2" role="alert">{{ .Error }}</div>
              {{ end }}

              <form method="post" action="/login" autocomplete="on">
                <input type="hidden" name="next" value="{{ .Next }}">
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="username" name="username" value="{{ .Username }}" autocomplete="username" required {{ if not .Username }}autofocus{{ end }}>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required {{ if .Username }}autofocus{{ end }}>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
              </form>
            </div>
          </div>
          <p class="text-center text-muted small mt-3">Croeso, Tervetuloa, Welcome</p>
        </div>
      </div>
    </div>
  </body>
</html>
