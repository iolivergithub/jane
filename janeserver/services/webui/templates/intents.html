{{define "content"}}
<div class="d-flex flex-wrap align-items-center gap-2 mb-3">
   <h3 class="mb-0 me-auto">Intents <span class="badge bg-secondary fs-6 align-middle">{{ len . }}</span></h3>
   <input id="cardFilter" type="search" class="form-control form-control-sm" style="max-width: 18rem"
          placeholder="Filter by name, function, description…" aria-label="Filter intents">
   <a href="/new/intent" class="btn btn-sm btn-primary"><i class="fa fa-plus me-1"></i>New intent</a>
   <a href="/loadstandardintents" class="btn btn-sm btn-outline-primary"><i class="fa fa-refresh me-1"></i>Load standard intents</a>
</div>

{{ if . }}
<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-4 g-2">
   {{ range . }}
   <div class="col j-filterable" data-search="{{ .I.Name }} {{ .I.Function }} {{ .I.Description }}">
      {{ template "intentsummarylist.html" . }}
   </div>
   {{ end }}
</div>
<p id="cardNoMatch" class="text-body-secondary fst-italic mt-2 d-none">No intents match the filter.</p>
{{ else }}
<div class="alert alert-secondary">No intents defined yet. <a href="/loadstandardintents">Load the standard intents</a> or <a href="/new/intent">create one</a>.</div>
{{ end }}

<script>
(function () {
   var input = document.getElementById('cardFilter');
   var items = Array.prototype.slice.call(document.querySelectorAll('.j-filterable'));
   var none = document.getElementById('cardNoMatch');
   if (!input || !items.length) return;
   input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase(), shown = 0;
      items.forEach(function (el) {
         var hit = !q || el.getAttribute('data-search').toLowerCase().indexOf(q) >= 0;
         el.classList.toggle('d-none', !hit);
         if (hit) shown++;
      });
      none.classList.toggle('d-none', shown > 0);
   });
})();
</script>
{{end}}
