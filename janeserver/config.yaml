#Some general naming
system:
  name: ASVR_GO_1

#MongoDB Configuration
database:
  connection: mongodb://127.0.0.1:27017
  name: testasvrlocal

#MQTT Configuration
messaging:
  broker: 127.0.0.1
  port: 1883
  portws: 8081
  clientid: asvrgo1

#REST Interface Configuration
rest:
  port: 8520
  crt: temporary.crt
  key: temporary.key
  usehttp: true
  listenon: 0.0.0.0

#Web Interface Configuration
web:
  port: 8540
  crt: temporary.crt
  key: temporary.key
  usehttp: true  
  listenon: 0.0.0.0


#X3270 (tn3270 terminal) Interface Configuration
x3270:
  port: 3270
  listenon: 0.0.0.0
    

#Log file
logging:
  logfilelocation: /tmp/ga10.log
  sessionupdatelogging: false

#Footer signing (optional - if this section is missing, an ephemeral key is generated at each start
#and footers on claims, results and sessions cannot be verified once Jane stops)
#The key is a PEM private key: PKCS#8, PKCS#1 or SEC1; RSA (PS256), ECDSA P-256/384/521 (ES256/384/512) or Ed25519 (EdDSA)
#e.g. openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out signing.key
#signing:
#  keyfile: /etc/opt/jane/signing.key

#Authentication (optional - if this section is missing, no login is required)
#Users are held in the "users" collection; add them or reset passwords with etc/addjaneuser/addjaneuser, e.g.
#  etc/addjaneuser/addjaneuser ian mongodb://127.0.0.1:27017 testasvrlocal
#auth:
#  web: true            # require a login for the Web UI
#  rest: false          # require an API key for the REST API (jp/scripts send Authorization: Bearer jane_...; see docs/authentication.md)
#  x3270: false         # require a logon on the x3270 interface (passwords travel unencrypted)
#  sessiontimeout: 30m  # Web UI login, or x3270 logon, expires after this long without use
